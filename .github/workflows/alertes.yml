# Every 10 minutes: detect significant earthquakes, build the images, reel and captions, put the files in a release,
# publish on Instagram and Facebook when the Meta key is set, and open one issue per alert with everything.
name: Alerts

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      id:
        description: "USGS event id to build by hand (optional, e.g. us6000u43g)"
        required: false
      reseaux:
        description: "Networks to publish for a manual run (e.g. reel, or instagram,facebook). Empty = none on a manual run"
        required: false

concurrency:
  group: alerts
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  alerts:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Remotion's headless browser kept between runs (no 120 MB download each time)
      - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: node_modules/.remotion
          key: remotion-browser-4.0.535-${{ runner.os }}
      - name: Detect and build
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: node src/principal.mjs ${{ inputs.id }}
      - name: One release per alert (public direct downloads)
        if: hashFiles('sortie/*/issue.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for d in sortie/*/; do
            [ -f "$d/issue.md" ] || continue
            id=$(basename "$d")
            gh release create "alert-$id-$GITHUB_RUN_ID" $(ls "$d"*.jpg "$d"*.mp4 2>/dev/null) --title "$(cat "$d/titre.txt")" --notes "Images and reel of this alert. Captions: see the issue."
          done
      - name: Publish on Instagram and Facebook
        continue-on-error: true
        if: hashFiles('sortie/*/issue.md') != '' && (inputs.id == '' || inputs.reseaux != '')
        env:
          META_PAGE_TOKEN_SEISMES: ${{ secrets.META_PAGE_TOKEN_SEISMES }}
          RESEAUX: ${{ inputs.reseaux }}
        run: node src/publier-meta.mjs "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/alert-{id}-$GITHUB_RUN_ID"
      - name: One issue per alert
        if: hashFiles('sortie/*/issue.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for d in sortie/*/; do
            [ -f "$d/issue.md" ] || continue
            id=$(basename "$d"); base="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/alert-$id-$GITHUB_RUN_ID"
            {
              [ -f "$d/publie.md" ] && cat "$d/publie.md" && echo
              echo "## Files"
              for f in $(ls "$d"*.jpg "$d"*.mp4 2>/dev/null); do n=$(basename "$f"); echo "- [$n]($base/$n)"; done
              echo
              for f in $(ls "$d"*.jpg 2>/dev/null); do n=$(basename "$f"); echo "<img src=\"$base/$n\" width=\"260\">"; done
              echo
              cat "$d/issue.md"
            } > "$d/issue-complet.md"
            gh issue create --title "$(cat "$d/titre.txt")" --body-file "$d/issue-complet.md"
          done
      - name: Remember what was posted
        if: inputs.id == ''
        run: |
          git config user.name "liveatlas-alerts"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add etat/publies.json
          git diff --cached --quiet || (git commit -m "State $(date -u +%Y-%m-%dT%H:%MZ)" && git push)
